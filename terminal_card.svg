<text x="440" y="190" class="det-line-5" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">Uptime: </tspan><tspan fill="#e2e8f0">2.5 Years (2024 - 2026)</tspan></text>
<text x="440" y="212" class="det-line-6" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">Shell: </tspan><tspan fill="#e2e8f0">zsh (Custom Console)</tspan></text>
<text x="440" y="234" class="det-line-7" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">Terminal: </tspan><tspan fill="#e2e8f0">AGY-Terminal</tspan></text>
<text x="440" y="256" class="det-line-8" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">CPU: </tspan><tspan fill="#e2e8f0">Apple M-series</tspan></text>
<text x="440" y="278" class="det-line-9" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">GPU: </tspan><tspan fill="#e2e8f0">NVIDIA Hopper H100 (Simulated)</tspan></text>

  </text>

  <!-- Vertical Divider -->
  <line x1="410" y1="65" x2="410" y2="450" stroke="#102554" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Right Column: Animated Neofetch Details -->
  <text x="440" y="80" class="det-line-0" font-family="SFMono-Regular, Consolas, monospace" font-size="14px"><tspan font-weight="bold" fill="#00d4ff">piyush</tspan><tspan fill="#e2e8f0">@</tspan><tspan font-weight="bold" fill="#3b82f6">iitj</tspan></text>
<text x="440" y="102" class="det-line-1" font-family="SFMono-Regular, Consolas, monospace" font-size="14px"><tspan fill="#475569">-----------------------</tspan></text>

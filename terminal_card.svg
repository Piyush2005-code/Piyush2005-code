<svg width="820" height="490" viewBox="0 0 820 490" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Static Glow Filter (safe for GitHub Camo) -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00d4ff" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3b82f6" flood-opacity="0.2" />
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="820" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <linearGradient id="bgGrad" x1="0" y1="0" x2="820" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="100%" stop-color="#09132e" />
    </linearGradient>
    
    <linearGradient id="asciiGrad" x1="30" y1="80" x2="380" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <linearGradient id="glassGrad" x1="0" y1="0" x2="820" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
    
    <!-- Pure CSS Animations -->
    <style type="text/css">
      
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInText {
      from { opacity: 0; transform: translateX(8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
    @keyframes colorRotate {
      from { filter: hue-rotate(0deg); }
      to { filter: hue-rotate(360deg); }
    }
    
    .ascii-logo {
      opacity: 0;
      animation: fadeIn 0.8s ease-out forwards, colorRotate 10s linear infinite;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    .animated-border {
      animation: colorRotate 8s linear infinite;
    }
    
    .det-line-0 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.30s;
    }
    .det-line-1 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.38s;
    }
    .det-line-2 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.46s;
    }
    .det-line-3 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.54s;
    }
    .det-line-4 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.62s;
    }
    .det-line-5 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.70s;
    }
    .det-line-6 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.78s;
    }
    .det-line-7 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.86s;
    }
    .det-line-8 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 0.94s;
    }
    .det-line-9 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.02s;
    }
    .det-line-10 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.10s;
    }
    .det-line-11 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.18s;
    }
    .det-line-12 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.26s;
    }
    .det-line-13 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.34s;
    }
    .det-line-14 {
      opacity: 0;
      animation: slideInText 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      animation-delay: 1.42s;
    }
    .det-blocks {
      opacity: 0;
      animation: fadeIn 0.4s ease-out forwards;
      animation-delay: 1.57s;
    }
    </style>
  </defs>

  <!-- Main Terminal Card Frame -->
  <g filter="url(#glow)">
    <rect x="15" y="15" width="790" height="460" rx="12" fill="url(#bgGrad)" />
    <rect x="15" y="15" width="790" height="460" rx="12" fill="url(#glassGrad)" />
    <!-- The border rotates colors using CSS hue-rotate -->
    <rect class="animated-border" x="15.5" y="15.5" width="789" height="459" rx="11.5" stroke="url(#borderGrad)" stroke-width="1.5" />
  </g>

  <!-- Title Bar -->
  <path d="M16 16 H804 V48 H16 Z" fill="#080f25" />
  <line x1="15" y1="48" x2="805" y2="48" stroke="#102554" stroke-width="1" />

  <!-- Window Control Buttons (Mac Style) -->
  <circle cx="38" cy="32" r="6" fill="#ff5f56" />
  <circle cx="58" cy="32" r="6" fill="#ffbd2e" />
  <circle cx="78" cy="32" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="410" y="36" fill="#7f9bc8" font-family="SFMono-Regular, Consolas, monospace" font-size="13px" font-weight="500" text-anchor="middle">piyush@iitj: ~</text>

  <!-- Terminal Tab Indicator -->
  <g opacity="0.8">
    <rect x="680" y="24" width="100" height="16" rx="4" fill="#13234d" />
    <text x="730" y="35" fill="#00d4ff" font-family="SFMono-Regular, Consolas, monospace" font-size="10px" font-weight="bold" text-anchor="middle">ACTIVE AGENT</text>
  </g>


<text x="440" y="366" class="det-line-13" font-family="SFMono-Regular, Consolas, monospace" font-size="13px"><tspan font-weight="bold" fill="#3b82f6">Interests: </tspan><tspan fill="#e2e8f0">ML Infra, OS, CV, Robotics</tspan></text>

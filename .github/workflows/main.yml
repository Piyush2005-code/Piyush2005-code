name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Contribution calendar + streak/commit stats
      - uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_display: regular
          config_timezone: Asia/Kolkata

      # Most-used languages (separate image so neither one gets cropped)
      - uses: lowlighter/metrics@latest
        with:
          output_action: none
          filename: github-metrics-languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          config_display: regular
          config_timezone: Asia/Kolkata

      # The plugin crops the bottom of the isometric calendar; pad it.
      - name: Fix calendar cropping
        run: python3 scripts/fix_metrics_svg.py github-metrics.svg

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg github-metrics-languages.svg
          git diff --cached --quiet || git commit -m "Update metrics images - [Skip GitHub Action]"
          git push
